# Compila la APK de Android de Polinización (Capacitor) y la publica en Releases.
# Enlace fijo de descarga: https://github.com/didpalmares/Polinizacion/releases/latest/download/Polinizacion.apk
# Secretos requeridos para la firma: POLINIZACION_KEYSTORE_B64 (llave en base64) y POLINIZACION_KEYSTORE_PASS (contraseña).
name: APK Android

on:
  push:
    branches: [main]
    paths: ['apk/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apk
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Versión de la APK en el agente de usuario (la app la muestra en el menú)
        run: |
          node -e "const fs=require('fs'),f='capacitor.config.json',c=JSON.parse(fs.readFileSync(f,'utf8'));c.android.appendUserAgent='PolinizacionAPK/1 v'+process.env.VERSION_NAME;fs.writeFileSync(f,JSON.stringify(c,null,2))"
          grep appendUserAgent capacitor.config.json

      - name: Instalar dependencias y sincronizar Capacitor
        run: |
          npm ci || npm install
          npx cap sync android

      - name: Preparar llave de firma
        id: firma
        env:
          KS_B64: ${{ secrets.POLINIZACION_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.POLINIZACION_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/polinizacion.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/polinizacion.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=polinizacion" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "firmada=si" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sin secretos de firma: se compila una APK de prueba (debug) y no se publica en Releases."
            echo "firmada=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK firmada
        if: steps.firma.outputs.firmada == 'si'
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Polinizacion.apk"

      - name: Compilar APK de prueba
        if: steps.firma.outputs.firmada != 'si'
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Polinizacion-prueba.apk"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Polinizacion-${{ env.VERSION_NAME }}
          path: ${{ github.workspace }}/Polinizacion*.apk

      - name: Publicar en Releases
        if: steps.firma.outputs.firmada == 'si'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ env.VERSION_NAME }}
          name: Polinización APK ${{ env.VERSION_NAME }}
          body: |
            APK de Android de Polinización (Palmas de Tumaco S.A.S.).
            Instalar desde el celular: https://github.com/didpalmares/Polinizacion/releases/latest/download/Polinizacion.apk
          files: ${{ github.workspace }}/Polinizacion.apk
          make_latest: true
